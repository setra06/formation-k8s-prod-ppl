apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-k
  labels:
    app: webapp-k
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: webapp-k
  template:
    metadata:
      labels:
        app: webapp-k
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 64Mi
